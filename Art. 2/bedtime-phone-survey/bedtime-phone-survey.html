<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Do you use your mobile phone right before bedtime?</title>
<style>
:root{--navy:#0b1b3d;--ink:#eaf0ff;--blue:#6fb4ff;--soft:#9fb4e8;--warm:#ffc766;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#0b1b3d;--ink:#eaf0ff}}
:root[data-theme="dark"]{--navy:#0b1b3d;--ink:#eaf0ff}
*{box-sizing:border-box;margin:0}
html{background:var(--navy);scroll-padding-top:env(safe-area-inset-top,0px)}
body{min-height:100vh;min-height:100dvh;background:var(--navy);color:var(--ink);font-family:Georgia,'Times New Roman',serif;overflow-x:hidden;position:relative}
body::before{content:"";position:fixed;inset:auto -20% -35% -20%;height:70vh;background:radial-gradient(ellipse at 50% 100%,rgba(111,180,255,.45),rgba(111,180,255,0) 65%);animation:glow 3.2s ease-in-out infinite;pointer-events:none}
@keyframes glow{50%{opacity:.55}}
.slide{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8vh 6vw}
.eyebrow{font:.8rem system-ui,sans-serif;letter-spacing:.25em;text-transform:uppercase;color:var(--blue);margin-bottom:1.6rem}
h1{font-weight:400;font-size:clamp(1.9rem,5.2vw,3.8rem);line-height:1.15;max-width:18em;text-shadow:0 4px 30px #000}
.choices,.results{margin-top:3rem;width:min(560px,100%);transition:opacity .7s,transform .7s}
.choices{display:flex;gap:1.2rem;justify-content:center;position:relative;z-index:3}
.choices button{flex:1;font:inherit;font-size:clamp(1.4rem,3.2vw,2rem);color:var(--ink);background:rgba(111,180,255,.08);border:2px solid var(--blue);border-radius:99px;padding:1rem 1.2rem;cursor:pointer;transition:background .25s,transform .25s,box-shadow .25s}
.choices button:disabled{cursor:default;opacity:.7}
.choices button:hover,.choices button:focus-visible{background:rgba(111,180,255,.25);transform:translateY(-3px);box-shadow:0 0 30px rgba(111,180,255,.45);outline:none}
.hidden{opacity:0;transform:translateY(14px);pointer-events:none;position:absolute;visibility:hidden}
.row{margin-bottom:1.4rem;text-align:left}
.row .top{display:flex;justify-content:space-between;align-items:baseline;font-size:clamp(1.1rem,2.4vw,1.5rem);margin-bottom:.45rem}
.row .tag{font:.7rem system-ui,sans-serif;letter-spacing:.15em;text-transform:uppercase;color:var(--warm);margin-left:.7rem}
.track{height:20px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#3f7be0,var(--blue));transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.row.mine .track{box-shadow:0 0 0 2px var(--warm)}
.meta{font:.95rem system-ui,sans-serif;color:var(--soft);margin-top:.6rem;line-height:1.5}
.note{font:.85rem system-ui,sans-serif;color:var(--warm);margin-top:.8rem}
.change-answer{margin-top:1.2rem;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--soft);border-radius:99px;padding:.55rem 1rem;cursor:pointer}
.change-answer:hover,.change-answer:focus-visible{background:rgba(111,180,255,.18);outline:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<main class="slide">
 <p class="eyebrow">Quick survey</p>
 <h1>Do you use your mobile phone right before bedtime?</h1>
 <div class="choices" id="choices">
  <button type="button" data-a="yes">Yes.</button>
  <button type="button" data-a="no">No.</button>
 </div>
 <div class="results hidden" id="results" aria-live="polite">
  <div class="row" data-r="yes"><div class="top"><span>Yes.<span class="tag" hidden>Your answer</span></span><span class="pct">0%</span></div><div class="track"><div class="fill"></div></div></div>
  <div class="row" data-r="no"><div class="top"><span>No.<span class="tag" hidden>Your answer</span></span><span class="pct">0%</span></div><div class="track"><div class="fill"></div></div></div>
  <p class="meta" id="meta"></p>
  <p class="note" id="note" hidden></p>
  <button type="button" class="change-answer" id="change-answer">Change answer</button>
 </div>
</main>
<script>
(function(){
 var counts={yes:0,no:0},mine=null,shown=false,db=null,uid=null,canWrite=null,allowChange=false;
 var ch=document.getElementById('choices'),res=document.getElementById('results'),meta=document.getElementById('meta'),note=document.getElementById('note'),change=document.getElementById('change-answer');
 function render(){
  var total=counts.yes+counts.no;
  ['yes','no'].forEach(function(k){
   var row=res.querySelector('[data-r="'+k+'"]'),p=total?Math.round(counts[k]/total*100):0;
   row.querySelector('.pct').textContent=p+'% ('+counts[k]+')';
   row.querySelector('.fill').style.width=p+'%';
   row.classList.toggle('mine',mine===k);
   row.querySelector('.tag').hidden=mine!==k;
  });
  meta.textContent=total===0?'No answers yet.':total===1?'1 person has answered so far.':total+' people have answered so far.';
 }
 function show(){
  if(shown)return;shown=true;
  ch.classList.add('hidden');res.classList.remove('hidden');
  render();
 }
 function saveFailed(){note.hidden=false;note.textContent='Your answer couldn\u2019t be saved, so it isn\u2019t counted in these results.'}
 ch.addEventListener('click',function(e){
  var b=e.target.closest('button[data-a]');if(!b||mine)return;
  mine=b.getAttribute('data-a');
  counts[mine]+=1; show();
  if(!db||!uid){saveFailed();return}
  if(canWrite===false){saveFailed();return}
  db.doc('votes/'+uid).set({a:mine,at:Date.now()}).catch(function(){saveFailed()});
 });
 change.addEventListener('click',function(){
  if(!mine)return;
  allowChange=true;
  mine=null;shown=false;
  counts={yes:0,no:0};
  ch.classList.remove('hidden');
  res.classList.add('hidden');
 });
 function start(){
  if(!window.claude||!claude.use){saveFailed();return}
  Promise.all([claude.use('db'),claude.use('user')]).then(function(r){
   db=r[0];var user=r[1];if(!db)return;
   return Promise.resolve(user?user.id():null).then(function(id){uid=id;return user?user.can('data.write'):null}).then(function(c){
    canWrite=c;
    if(mine&&db&&uid){
     if(canWrite===false)saveFailed();
     else db.doc('votes/'+uid).set({a:mine,at:Date.now()}).catch(function(){saveFailed()});
    }
    db.collection('votes').onSnapshot(function(snap){
     var c={yes:0,no:0},own=null;
     snap.docs.forEach(function(d){var v=d.data()||{};if(v.a==='yes'||v.a==='no'){c[v.a]++;if(uid&&d.id===uid)own=v.a}});
     counts=c;
     if(own&&allowChange&&own===mine){allowChange=false;note.hidden=true;show()}
     else if(own&&!allowChange){mine=own;note.hidden=true;show()}
     if(shown)render();
    },function(){});
   });
  }).catch(function(){});
 }
 start();
})();
</script>
</body>
</html>
